name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Wygeneruj google-services.json z szablonu i GitHub Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          test -n "$FIREBASE_API_KEY" || { echo "BRAK sekretu FIREBASE_API_KEY w GitHub Secrets!"; exit 1; }
          python3 -c 'import os; t = open("android/app/google-services.json.template").read(); open("android/app/google-services.json", "w").write(t.replace("__FIREBASE_API_KEY__", os.environ["FIREBASE_API_KEY"]))'
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mini-siem-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
